name: Jiang LLVM SDK

on:
  push:
    branches:
      - "feat/jiang-sdk-*"
      - "jiang/sdk-publish-*"
    tags:
      - "jiang-sdk-llvm-22.1.8-*"
  workflow_dispatch:
    inputs:
      package_revision:
        description: Jiang SDK packaging revision
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: jiang-llvm-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve SDK version
    runs-on: ubuntu-22.04
    outputs:
      package_revision: ${{ steps.version.outputs.package_revision }}
      publish: ${{ steps.version.outputs.publish }}
      source_run_id: ${{ steps.version.outputs.source_run_id }}
    steps:
      - name: Resolve trigger
        id: version
        env:
          INPUT_PACKAGE_REVISION: ${{ inputs.package_revision }}
        run: |
          package_revision="$INPUT_PACKAGE_REVISION"
          publish=false
          source_run_id=""
          case "$GITHUB_REF" in
            refs/tags/jiang-sdk-llvm-22.1.8-*)
              package_revision="${GITHUB_REF_NAME#jiang-sdk-llvm-22.1.8-}"
              publish=true
              ;;
            refs/heads/jiang/sdk-publish-*)
              recovery="${GITHUB_REF_NAME#jiang/sdk-publish-}"
              package_revision="${recovery##*-}"
              source_run_id="${recovery%-*}"
              publish=true
              ;;
          esac
          if [ -z "$package_revision" ]; then
            package_revision=1
          fi
          case "$package_revision" in
            *[!0-9]*|0)
              echo "package revision must be a positive integer" >&2
              exit 1
              ;;
          esac
          case "$source_run_id" in
            "") ;;
            *[!0-9]*|0)
              echo "source run id must be a positive integer" >&2
              exit 1
              ;;
          esac
          echo "package_revision=$package_revision" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.host }}
    if: needs.prepare.outputs.source_run_id == ''
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-22.04
          - host: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch the LLVM source revision
        run: git fetch --no-tags --depth=1 origin tag llvmorg-22.1.8

      - name: Check build prerequisites
        run: |
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v gzip

      - name: Build SDK
        run: |
          bash ./jiang/build_sdk.sh \
            --package-revision "${{ needs.prepare.outputs.package_revision }}" \
            --parallel 3

      - name: Upload SDK candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jiang-llvm-sdk-${{ matrix.host }}
          path: |
            build/jiang-sdk/*.tar.gz
            build/jiang-sdk/*.tar.gz.manifest.json
            build/jiang-sdk/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-assets:
    name: Verify SDK assets
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.prepare.outputs.source_run_id != '')
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Download SDK candidates
        if: needs.prepare.outputs.source_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jiang-llvm-sdk-*
          path: release-assets
          merge-multiple: true

      - name: Download retained release assets
        if: needs.prepare.outputs.source_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jiang-llvm-sdk-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - name: Verify release assets
        working-directory: release-assets
        env:
          PACKAGE_REVISION: ${{ needs.prepare.outputs.package_revision }}
        run: |
          linux_asset="jiang-llvm-22.1.8-$PACKAGE_REVISION-linux-x86_64.tar.gz"
          macos_asset="jiang-llvm-22.1.8-$PACKAGE_REVISION-macos-arm64.tar.gz"
          test -f "$linux_asset"
          test -f "$macos_asset"
          sha256sum --check ./*.tar.gz.sha256
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum ./*.tar.gz >SHA256SUMS
          sha256sum ./*.tar.gz ./*.tar.gz.manifest.json ./*.tar.gz.sha256 SHA256SUMS \
            >ASSET_SHA256SUMS

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jiang-llvm-sdk-release-assets
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish SDK
    if: >-
      always() &&
      needs.verify-assets.result == 'success' &&
      needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - verify-assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jiang-llvm-sdk-release-assets
          path: release-assets

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_REVISION: ${{ needs.prepare.outputs.package_revision }}
        run: |
          verify_remote_assets() {
            release_json="$1"
            expected_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
            actual_count="$(printf '%s' "$release_json" | jq '.assets | length')"
            test "$actual_count" -eq "$expected_count"

            while read -r digest name; do
              name="${name#./}"
              remote_digest="$(printf '%s' "$release_json" | jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest')"
              if [ "$remote_digest" != "sha256:$digest" ]; then
                echo "release asset digest mismatch: $name" >&2
                return 1
              fi
            done <release-assets/ASSET_SHA256SUMS

            asset_sums_digest="$(sha256sum release-assets/ASSET_SHA256SUMS | cut -d ' ' -f 1)"
            remote_asset_sums_digest="$(printf '%s' "$release_json" | jq -r \
              '.assets[] | select(.name == "ASSET_SHA256SUMS") | .digest')"
            test "$remote_asset_sums_digest" = "sha256:$asset_sums_digest"
          }

          tag="jiang-sdk-llvm-22.1.8-$PACKAGE_REVISION"
          if gh release view "$tag" >/dev/null 2>&1; then
            release_info="$(gh release view "$tag" --json databaseId,isDraft)"
            release_id="$(printf '%s' "$release_info" | jq -r .databaseId)"
            is_draft="$(printf '%s' "$release_info" | jq -r .isDraft)"
            if [ "$is_draft" != "true" ]; then
              release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
              verify_remote_assets "$release_json"
              echo "release $tag is already published and verified"
              exit 0
            fi
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "Jiang LLVM SDK 22.1.8-$PACKAGE_REVISION" \
              --notes "Jiang build-time LLVM 22.1.8 SDK for Linux x86_64 and macOS arm64."
            release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          fi

          gh release upload "$tag" release-assets/* --clobber
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          verify_remote_assets "$release_json"
          gh release edit "$tag" --draft=false --prerelease --latest=false
