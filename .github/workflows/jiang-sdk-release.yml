name: Jiang LLVM SDK

on:
  workflow_dispatch:
    inputs:
      package_revision:
        description: Jiang SDK packaging revision
        required: true
        default: "1"
        type: string
      publish:
        description: Publish an immutable-release candidate from jiang/22.1.8
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jiang-llvm-sdk-${{ inputs.package_revision }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-22.04
          - host: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch the LLVM source revision
        run: git fetch --no-tags --depth=1 origin tag llvmorg-22.1.8

      - name: Check build prerequisites
        run: |
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v zstd

      - name: Build SDK
        run: |
          bash ./jiang/build_sdk.sh \
            --package-revision "${{ inputs.package_revision }}" \
            --parallel 3

      - name: Upload SDK candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: jiang-llvm-sdk-${{ matrix.host }}
          path: |
            build/jiang-sdk/*.tar.zst
            build/jiang-sdk/*.tar.zst.manifest.json
            build/jiang-sdk/*.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish SDK
    if: inputs.publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require the maintenance branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "jiang/22.1.8" ]; then
            echo "SDK releases must be published from jiang/22.1.8" >&2
            exit 1
          fi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: jiang-llvm-sdk-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        working-directory: release-assets
        run: |
          sha256sum --check ./*.tar.zst.sha256
          test "$(find . -maxdepth 1 -name '*.tar.zst' | wc -l)" -eq 2
          sha256sum ./*.tar.zst >SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
        run: |
          tag="jiang-sdk-llvm-22.1.8-$PACKAGE_REVISION"
          gh release create "$tag" \
            release-assets/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Jiang LLVM SDK 22.1.8-$PACKAGE_REVISION" \
            --notes "Jiang build-time LLVM 22.1.8 SDK for Linux x86_64 and macOS arm64."
          gh release edit "$tag" --draft=false --prerelease
